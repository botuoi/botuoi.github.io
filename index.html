<h1>BoTuoi OLS</h1>
<p>Cài trên VPS trắng (chạy bằng <code>root</code>):</p>
<pre>curl -sO https://botuoi.github.io/get &amp;&amp; bash get &lt;TOKEN&gt;</pre>
<p>Kèm WordPress: thêm <code>wp</code> ở cuối. Cài xong gõ <code>botuoi</code> để mở menu.</p>
<p>Tệp <code>get</code> không chứa bí mật — nó chỉ dùng token bạn đưa để tải trình cài từ kho riêng.</p>
